# CI for your Skill Atlas repository: the typecheck, the tests and the CLI itself, on every push
# and pull request, on a clean machine. A pull request is ready when this is green.
name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # The browser tests: Google Chrome, as on the runner, and Playwright's ffmpeg for the videos.
      - run: npx playwright install --with-deps ffmpeg
      - run: npm test
        env:
          PLAYWRIGHT_CHANNEL: chrome
      # A video of every browser test; on a failure, the actual and the diff screenshots too.
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: browser-tests
          path: |
            test-results/
            playwright-report/
          retention-days: 14
      # The real CLI on the fixture repository, as a user would run it: it must exit 0.
      - name: Smoke test
        run: |
          ./skill-atlas help
          ./skill-atlas scan ./fixture
